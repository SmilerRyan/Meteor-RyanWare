name: Build JAR Artifact

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        run: ./gradlew build --no-daemon

      - name: Determine version and commit hash
        id: meta
        run: |
          version=$(./gradlew -q properties --no-daemon | grep '^version:' | sed 's/version: //')
          sha=$(git rev-parse --short HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Commit built JAR
        run: |
          mkdir -p dist
          jar=$(ls build/libs/*-standalone.jar | head -n 1)
          cp "$jar" "dist/RyanWare-standalone.jar"
          cp "index.html" "dist/index.html"
          cp "README.md" "dist/README.md"
          cp "knowledge_book.png" "dist/knowledge_book.png"

      - name: Upload Pages Site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
