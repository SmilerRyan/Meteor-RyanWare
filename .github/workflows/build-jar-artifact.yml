name: Build JAR Artifact

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        run: ./gradlew build --no-daemon

      - name: Determine version and commit hash
        id: meta
        run: |
          version=$(./gradlew -q properties --no-daemon | grep '^version:' | sed 's/version: //')
          sha=$(git rev-parse --short HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Commit built JAR
        run: |
          mkdir -p builds
          jar=$(ls build/libs/*-standalone.jar | head -n 1)
          dest=builds/${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}.jar
          cp "$jar" "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -m "Add built JAR for ${{ steps.meta.outputs.version }}@${{ steps.meta.outputs.sha }}" || echo "No changes to commit"
          git push origin HEAD:main
